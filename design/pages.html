<title>Stock Report Pages</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a page picker over one device frame. Each page opens with a three-part brief (who, what they decide,
   the one-sentence takeaway), then the page itself in the version 2 look, then its states. The frame switches between
   laptop and a 390px phone, and the frame is a size container so the phone view is the real card layout.
   Order stage colors use the validated blue ramp; status colors come with an icon and a label. */
:root, .force-dark {
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --r-control: 6px; --r-panel: 10px; --r-pill: 999px;
  --page: #181818; --panel: #1F1F1F; --raised: #272727; --line: #313131;
  --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --danger: #ec7070;
  --accent: #3987e5; --accent-fill: #2a78d6; --accent-ink: #ffffff;
  --s-good: #0ca30c; --s-warn: #fab219; --s-serious: #ec835a; --s-crit: #d03b3b;
  --st1: #184f95; --st2: #2a78d6; --st3: #5598e7; --st4: #86b6ef;
  --ring: 0 0 0 1px var(--line);
  --hover: oklch(1 0 0 / .05);
  --scrim: oklch(0 0 0 / .6);
  color-scheme: dark;
}
:root[data-theme="light"], .force-light {
  --page: #f6f6f4; --panel: #ffffff; --raised: #f0efec; --line: #e1e0d9;
  --ink: #0b0b0b; --ink2: #52514e; --muted: #75736e; --danger: #b42323;
  --accent: #2a78d6; --accent-fill: #2a78d6; --accent-ink: #ffffff;
  --st1: #86b6ef; --st2: #5598e7; --st3: #2a78d6; --st4: #1c5cab;
  --hover: oklch(0 0 0 / .04);
  --scrim: oklch(0 0 0 / .4);
  color-scheme: light;
}
.force-light, .force-dark { background: var(--page); color: var(--ink); }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink); font: 400 14px/20px var(--font);
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
h1, h2 { font-size: 20px; line-height: 28px; }
h3 { font-size: 16px; line-height: 24px; }
p { margin: 0; max-width: 70ch; text-wrap: pretty; }
.muted { color: var(--ink2); }
.meta { font-size: 12px; line-height: 16px; color: var(--ink2); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-control); }
.ic { flex-shrink: 0; display: inline-block; vertical-align: middle; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.picker { display: flex; flex-wrap: wrap; gap: 4px; }
.pk { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: var(--r-control); color: var(--ink2); background: none; border: 0; font: 500 14px/20px var(--font); cursor: pointer; }
.pk[aria-selected="true"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.pk .next { font-size: 12px; line-height: 16px; color: var(--muted); font-weight: 400; }
@media (hover: hover) and (pointer: fine) { .pk:hover { background: var(--hover); } }

.seg { display: inline-flex; background: var(--raised); border-radius: var(--r-control); padding: 2px; gap: 2px; }
.seg button { font: 500 12px/16px var(--font); padding: 4px 12px; border: 0; border-radius: 4px; background: transparent; color: var(--ink2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--ring); }

#shell { display: flex; flex-direction: column; gap: 16px; padding: 0; border-radius: var(--r-panel); }
#shell.force-light, #shell.force-dark { padding: 16px; box-shadow: var(--ring); }
.brief { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px 24px; padding: 16px; background: var(--panel); border-radius: var(--r-panel); box-shadow: var(--ring); }
.brief .bl { font-size: 12px; line-height: 16px; color: var(--muted); }
.brief .bt { font-size: 14px; line-height: 20px; }
.device { background: var(--page); border-radius: var(--r-panel); box-shadow: var(--ring); padding: 16px; display: flex; flex-direction: column; gap: 16px; container-type: inline-size; container-name: dev; width: 100%; max-width: 1160px; margin: 0 auto; min-width: 0; }
#shell.phone .device { max-width: 390px; padding: 12px; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 500 14px/20px var(--font); padding: 8px 12px; border-radius: var(--r-control); border: 1px solid var(--line);
  background: transparent; color: var(--ink); cursor: pointer; transition: transform 120ms var(--ease), background-color 120ms var(--ease); touch-action: manipulation; text-decoration: none; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }
.btn.quiet { color: var(--ink2); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { padding: 4px 8px; font-size: 12px; line-height: 16px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn:disabled:active { transform: none; }
@media (hover: hover) and (pointer: fine) { .btn:hover:not(.primary):not(:disabled) { background: var(--hover); } .btn.primary:hover { filter: brightness(1.08); } }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 16px; color: var(--ink2); }
.field select, .field input, .field textarea { font: 400 14px/20px var(--font); padding: 8px 12px; border-radius: var(--r-control); border: 1px solid var(--line); background: var(--page); color: var(--ink); width: 100%; }
.field.err input { border-color: var(--s-crit); }
.hint { font-size: 12px; line-height: 16px; color: var(--ink2); }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; border-radius: var(--r-pill); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; color: var(--ink);
  background: color-mix(in srgb, var(--c, var(--muted)) 16%, var(--panel)); }
.badge .ic { color: var(--c, var(--muted)); }
.badge.crit { --c: var(--s-crit); } .badge.serious { --c: var(--s-serious); } .badge.warn { --c: var(--s-warn); } .badge.good { --c: var(--s-good); } .badge.info { --c: var(--accent); } .badge.plain { --c: var(--muted); }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: relative; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.brand .logo { width: 24px; height: 24px; border-radius: 6px; background: var(--accent-fill); color: #fff; display: grid; place-items: center; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: var(--r-control); color: var(--ink2); text-decoration: none; border: 0; background: none; font: 500 14px/20px var(--font); cursor: pointer; }
.tab[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
@media (hover: hover) and (pointer: fine) { .tab:hover { background: var(--hover); } }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.avatar { width: 32px; height: 32px; border-radius: var(--r-pill); background: var(--raised); color: var(--ink); display: grid; place-items: center; font-size: 12px; font-weight: 600; border: 0; cursor: pointer; box-shadow: var(--ring); }
.pop { position: absolute; z-index: 5; background: var(--raised); border-radius: var(--r-panel); box-shadow: var(--ring), 0 8px 24px oklch(0 0 0 / .35); padding: 4px; min-width: 220px; display: flex; flex-direction: column; }
.pop[hidden] { display: none; }
.pop a, .pop button { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--r-control); color: var(--ink); text-decoration: none; background: none; border: 0; font: 400 14px/20px var(--font); cursor: pointer; text-align: left; }
.pop button:disabled { opacity: .5; cursor: not-allowed; }
.pop .dng { color: var(--danger); }
@media (hover: hover) and (pointer: fine) { .pop a:hover, .pop button:hover:not(:disabled) { background: var(--hover); } }
.rel { position: relative; }

/* Panels */
.panel { background: var(--panel); border-radius: var(--r-panel); box-shadow: var(--ring); padding: 16px; min-width: 0; }
.phead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.phead .sub { font-size: 12px; line-height: 16px; color: var(--ink2); }
.plink { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 500; font-size: 12px; background: none; border: 0; cursor: pointer; font-family: var(--font); padding: 4px 0; text-decoration: none; }
.headline { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.headline .sentence { font-size: 20px; line-height: 28px; font-weight: 600; max-width: 46ch; text-wrap: balance; }
.headline .sentence span { color: var(--ink2); font-weight: 400; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink2); font-size: 12px; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--font); }
.back .ic { transform: rotate(180deg); }
.twocol { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* Lists */
.lhead, .orow { display: grid; grid-template-columns: minmax(168px, 1.2fr) minmax(188px, 1.2fr) 168px 88px 56px minmax(96px, .8fr); gap: 16px; align-items: center; }
.lhead, .alhead { padding: 0 0 8px; font-size: 12px; line-height: 16px; color: var(--ink2); border-bottom: 1px solid var(--line); }
.orow, .arow, .trow { padding: 12px 0; border-bottom: 1px solid var(--line); }
.orow { cursor: pointer; }
.orow:last-child, .arow:last-child, .trow:last-child { border-bottom: 0; }
@media (hover: hover) and (pointer: fine) { .orow:hover { background: var(--hover); } }
.alhead, .arow { display: grid; grid-template-columns: 72px minmax(152px, 1fr) 64px minmax(232px, 1.6fr) 96px; gap: 16px; align-items: center; }
.trow { display: grid; grid-template-columns: minmax(200px, 1.6fr) 72px 56px 80px 72px; gap: 12px; align-items: center; }
.orow.srow, .lhead.shead { grid-template-columns: minmax(168px, 1.2fr) 196px 148px 164px 72px 144px; }
.crow { display: grid; grid-template-columns: 96px minmax(120px, 1fr) 184px 112px; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.crow:last-child { border-bottom: 0; }
.pname strong { font-weight: 600; }
.pname .code { color: var(--muted); font-size: 12px; margin-left: 4px; }
.pname .flags { margin-top: 4px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.cell .lab { display: none; font-size: 12px; line-height: 16px; color: var(--muted); }
.cell .big { font-weight: 600; font-variant-numeric: tabular-nums; }
.cell .small { font-size: 12px; line-height: 16px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.cell.num { text-align: right; font-variant-numeric: tabular-nums; }
.cell .nx { display: flex; gap: 8px; align-items: flex-start; }
.nx .ic { margin-top: 2px; }
.nx.warn .ic { color: var(--s-warn); } .nx.serious .ic { color: var(--s-serious); } .nx.ok .ic { color: var(--s-good); } .nx.idle .ic { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; line-height: 16px; color: var(--ink2); align-items: center; margin-bottom: 8px; }
.k { display: inline-block; width: 12px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.mc { display: block; overflow: visible; }

/* Stepper and timeline */
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); list-style: none; margin: 0; padding: 0; }
.step { position: relative; display: flex; flex-direction: column; gap: 2px; padding-top: 32px; padding-right: 8px; }
.step::before { content: ""; position: absolute; top: 11px; left: 0; right: 0; height: 2px; background: var(--line); }
.step.done::before { background: var(--accent); }
.step .mk { position: absolute; top: 0; left: 0; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); box-shadow: 0 0 0 2px var(--line); color: var(--muted); z-index: 1; }
.step.done .mk { background: var(--accent-fill); color: #fff; box-shadow: none; }
.step.cur .mk { box-shadow: 0 0 0 2px var(--accent); color: var(--accent); }
.step b { font-weight: 600; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl li { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 12px; padding-bottom: 16px; }
.tl li::before { content: ""; position: absolute; left: 3.5px; top: 12px; bottom: 0; width: 1px; background: var(--line); }
.tl li:last-child::before { display: none; }
.tl .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
.mbar { display: flex; gap: 2px; height: 12px; }
.mbar i { display: block; height: 12px; border-radius: 2px; }
.mrow { display: grid; grid-template-columns: 88px minmax(0, 1fr) 72px; gap: 12px; align-items: center; padding: 4px 0; }
.mrow .track { height: 12px; background: var(--line); border-radius: 2px; display: flex; overflow: hidden; }
.mrow .track i { display: block; height: 12px; background: var(--st3); }

/* Modal */
#modals .scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
#modals .scrim[hidden] { display: none; }
.modal { background: var(--panel); color: var(--ink); box-shadow: var(--ring), 0 16px 48px oklch(0 0 0 / .4); border-radius: var(--r-panel); width: 100%; max-width: 640px; padding: 24px; display: flex; flex-direction: column; gap: 16px; animation: pop 160ms var(--ease); }
#shell.phone .modal { max-width: 390px; padding: 16px; }
@keyframes pop { from { opacity: 0; transform: scale(.96); } }
.modal header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.mfoot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.plan { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r-panel); background: var(--page); box-shadow: var(--ring); cursor: pointer; }
.plan input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.plan:has(input:checked) { box-shadow: 0 0 0 2px var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
.plan:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.plan:has(input:disabled) { opacity: .5; cursor: not-allowed; }
.plan .title { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.plan .units { font-size: 20px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tag { font-size: 12px; line-height: 16px; padding: 0 8px; border-radius: var(--r-pill); background: var(--accent-fill); color: var(--accent-ink); font-weight: 500; }
.callout { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-radius: var(--r-control); background: color-mix(in srgb, var(--c, var(--s-warn)) 14%, var(--panel)); font-size: 12px; line-height: 16px; }
.callout .ic { color: var(--c, var(--s-warn)); }
.callout.crit { --c: var(--s-crit); } .callout.good { --c: var(--s-good); } .callout.info { --c: var(--accent); }
.msgbox { white-space: pre-wrap; background: var(--page); border-radius: var(--r-control); padding: 12px; box-shadow: var(--ring); font-size: 14px; line-height: 20px; max-height: 240px; overflow: auto; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px 12px; text-align: center; }
.skel { height: 12px; border-radius: 4px; background: var(--raised); }
.states { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.plist2 { margin: 8px 0 0; padding-left: 16px; display: flex; flex-direction: column; gap: 4px; }

/* Phone and narrow layouts, driven by the frame width */
@container dev (max-width: 760px) {
  .lhead, .alhead { display: none; }
  .orow, .arow, .orow.srow { grid-template-columns: 1fr 1fr; gap: 8px 16px; }
  .crow { grid-template-columns: 1fr 1fr; }
  .crow > :nth-child(2), .crow > :nth-child(3) { grid-column: 1 / -1; }
  .orow .pname, .arow .cell.wide { grid-column: 1 / -1; }
  .cell .lab { display: block; }
  .cell.num { text-align: left; }
  .twocol { grid-template-columns: minmax(0, 1fr); }
  .trow { grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  .trow > :first-child { grid-column: 1 / -1; }
  .legend.hide-narrow { display: none; }
  .headline .sentence { font-size: 16px; line-height: 24px; }
  .stepper { grid-template-columns: 1fr 1fr; row-gap: 12px; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:active { transform: none; } .modal { animation: none; } }
</style>

<main>
  <div>
    <h1>Stock Report pages</h1>
    <p class="muted">Every page in the version 2 look, one at a time. Pick a page, then switch between laptop and phone. Each page starts with who uses it, what they decide, and the one sentence it should leave them with.</p>
  </div>
  <div class="controls">
    <div class="picker" role="tablist" aria-label="Pages" id="picker"></div>
    <div class="row">
      <span class="seg" role="group" aria-label="Device" id="devsw"><button type="button" data-d="laptop" aria-pressed="true">Laptop</button><button type="button" data-d="phone" aria-pressed="false">Phone</button></span>
      <span class="seg" role="group" aria-label="Preview theme" id="thsw"><button type="button" data-t="page" aria-pressed="true">Page</button><button type="button" data-t="dark" aria-pressed="false">Dark</button><button type="button" data-t="light" aria-pressed="false">Light</button></span>
    </div>
  </div>
  <div id="shell">
    <div class="brief" id="brief"></div>
    <div class="device" id="device"><div id="app" style="display:flex;flex-direction:column;gap:16px"></div></div>
    <div id="modals"></div>
  </div>
</main>

    var o = [
      { id: "p1", t: "Reorder point", u: Math.max(0, Math.ceil(59 * p.burn - (p.stock + ordered))), n: "Reaches the 59-day reorder line" },
      { id: "p2", t: "SOP suggestion", u: p.sugg, tag: "Suggested", n: "Target 60 days plus 45 days lead time. Uses warehouse stock only." },
      { id: "p3", t: "Cover 90 days", u: Math.max(0, Math.ceil(90 * p.burn - (p.stock + ordered))), n: "Longest cover from one order" }];
    return '<div class="plans" role="radiogroup" aria-label="Order size">' + o.map(function (x) {
      var days = (p.stock + ordered + x.u) / p.burn;
      return '<label class="plan"><input type="radio" name="plan" value="' + x.u + '"' + (x.id === "p2" && x.u > 0 ? " checked" : "") + (x.u === 0 ? " disabled" : "") + '><span class="title">' + x.t + (x.tag ? '<span class="tag">' + x.tag + '</span>' : "") + '</span><span class="units">' + fmt(x.u) + ' units</span><span class="meta">' + days.toFixed(1) + ' days of stock including everything on order</span><span class="meta">' + (x.u === 0 ? "Already covered" : x.n) + '</span></label>';
    }).join("") + '</div>';
  }
  function openModal(kind, ctx) {
    var html = "", host = document.getElementById("modals"), o;
    if (kind === "message") { o = SR.order(ctx.id || S.orderName); var k = ctx.k || "order"; html = modalShell("Message to " + SR.SUP[o.sup], o.name + ". Copy it and send it from your own email.", '<div class="msgbox" id="msgtext">' + esc(msgText(o, k)) + '</div>', '<span class="meta" id="msgstate">Nothing is sent from here.</span><div class="row"><button class="btn quiet" type="button" data-act="close">Close</button><button class="btn primary" type="button" data-act="copy">' + icon("copy") + 'Copy message</button></div>'); }
    else if (kind === "tracking") { o = SR.order(S.orderName); var stt = SR.stagesOf(o), left = o.units - stt.tracked;
      html = modalShell("Add tracking", o.name + " · " + fmt(left) + " of " + fmt(o.units) + " units have no tracking", '<div class="grid2"><label class="field" for="t-num">Tracking number<input id="t-num" placeholder="1Z999AA10123456784" autocomplete="off"></label><label class="field" for="t-units">Units<input id="t-units" type="number" min="1" value="' + left + '"></label></div><div class="hint" id="t-hint">Carrier is detected from the number.</div><div class="callout info" id="t-cap">' + icon("circle-alert") + '<span>' + fmt(left) + ' units left to track. You can add more tracking numbers later.</span></div>', '<span></span><div class="row"><button class="btn quiet" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" data-act="close">Add tracking</button></div>'); ctx.left = left; }
    else if (kind === "delete") { o = SR.order(S.orderName); html = modalShell("Delete " + o.name + "?", "", '<p class="muted">This removes the order, its tracking and its history for good. To stop it counting as ordered, close or cancel it instead.</p>', '<span></span><div class="row"><button class="btn quiet" type="button" data-act="close">Keep it</button><button class="btn danger" type="button" data-act="close">Yes, delete</button></div>'); }
    else if (kind === "edit") { o = SR.order(S.orderName); var stE = SR.stagesOf(o); var floor = Math.max(stE.tracked, stE.arrived, 1);
      html = modalShell("Edit " + o.name, "", '<div class="grid2"><label class="field" for="e-sup">Supplier<select id="e-sup"><option>' + SR.SUP.Acme + '</option><option' + (o.sup === "Nova" ? " selected" : "") + '>' + SR.SUP.Nova + '</option></select></label><label class="field" for="e-units">Units<input id="e-units" type="number" min="' + floor + '" value="' + o.units + '"></label></div><div class="hint">Units cannot go below ' + fmt(floor) + ', which is already on tracking or has arrived.</div><label class="field" for="e-notes">Notes<textarea id="e-notes" rows="2">' + esc(o.notes) + '</textarea></label>', '<span></span><div class="row"><button class="btn quiet" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" data-act="close">Save changes</button></div>'); }
    else if (kind === "new") { var code = ctx.code || "GIZ"; var opts = SR.PRODUCTS.map(function (p) { return '<option value="' + p.code + '"' + (p.code === code ? " selected" : "") + '>' + p.name + '</option>'; }).join("");
      html = modalShell("New order", "Pick a size, then adjust the units if you need to", '<div class="grid2"><label class="field" for="n-prod">Product<select id="n-prod" data-act="new-prod">' + opts + '</select></label><label class="field" for="n-sup">Supplier<select id="n-sup"><option>' + SR.SUP.Acme + '</option><option>' + SR.SUP.Nova + '</option></select></label></div><div id="n-plans">' + planCards(code) + '</div><div class="grid2"><label class="field" for="n-units">Units<input id="n-units" type="number" min="1" value="' + (SR.product(code).sugg || "") + '"></label><label class="field" for="n-notes">Notes (optional)<input id="n-notes" placeholder="Rush if possible"></label></div>', '<span class="meta" id="n-sum"></span><div class="row"><button class="btn quiet" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" data-act="close">Create order</button></div>'); }
    else if (kind === "arrival") { var opts2 = SR.PRODUCTS.map(function (p) { return '<option value="' + p.code + '"' + (p.code === "GIZ" ? " selected" : "") + '>' + p.name + '</option>'; }).join("");
      html = modalShell("Record arrival", "The preview shows which orders the units go to", '<div class="grid2"><label class="field" for="a-prod">Product<select id="a-prod" data-act="arr-prod">' + opts2 + '</select></label><label class="field" for="a-units">Units<input id="a-units" type="number" min="1" value="250"></label></div><label class="field" for="a-date">Date<input id="a-date" type="date" value="2026-10-29"></label><div id="a-prev"></div>', '<span class="meta" id="a-sum"></span><div class="row"><button class="btn quiet" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" data-act="close">Record arrival</button></div>'); }
    else if (kind === "fix") { var a = (SR.ARRIVALS.concat([SR.EXAMPLE_ARRIVAL])).filter(function (x) { return x.id === ctx.id; })[0], p2 = SR.product(a.code);
      var cands = SR.ORDERS.filter(function (x) { return x.code === a.code && SR.stagesOf(x).open; });
      var rows = cands.map(function (x) { var cur = (a.allocs.filter(function (al) { return al.order === x.name; })[0] || { u: 0 }).u; return '<label class="mrow field" style="grid-template-columns:96px minmax(0,1fr) 96px" for="f-' + x.name + '"><b style="font-weight:600;color:var(--ink)">' + x.name + '</b><span class="meta">up to ' + fmt(x.units) + ' units</span><input id="f-' + x.name + '" type="number" min="0" max="' + x.units + '" value="' + cur + '" data-fix="1"></label>'; }).join("");
      var matched = a.allocs.reduce(function (s, al) { return s + al.u; }, 0);
      html = modalShell("Fix match", fmt(a.units) + " " + p2.name + " arrived " + (a.ago === 0 ? "today" : dayStr(-a.ago)), '<div class="stack" style="gap:4px">' + rows + '<label class="mrow field" style="grid-template-columns:96px minmax(0,1fr) 96px" for="f-none"><b style="font-weight:600;color:var(--ink)">Not from an order</b><span class="meta">stays in stock</span><input id="f-none" type="number" min="0" value="' + (a.units - matched) + '" data-fix="1"></label></div><div class="callout" id="f-state">' + icon("circle-alert") + '<span></span></div>', '<span></span><div class="row"><button class="btn quiet" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" id="f-save" data-act="close">Save match</button></div>'); ctx.units = a.units; }
    host.innerHTML = html; S.modal = { kind: kind, ctx: ctx };
    host.querySelector(".scrim").hidden = false;
    wireModal(kind, ctx);
    var f = host.querySelector("input,select,textarea,button.primary"); if (f) f.focus();
  }
  function closeModal() { var host = document.getElementById("modals"); host.innerHTML = ""; S.modal = null; }
  function wireModal(kind, ctx) {
    var $ = function (id) { return document.getElementById(id); };
    if (kind === "tracking") {
      var upd = function () { var n = $("t-num").value, c = SR.detectCarrier(n), u = +$("t-units").value || 0, over = u > ctx.left;
        $("t-hint").textContent = n ? (c ? "Detected: " + c : "Carrier not recognised. You can choose one after adding.") : "Carrier is detected from the number.";
        var cap = $("t-cap"); cap.className = "callout " + (over ? "crit" : "info"); cap.querySelector("span").textContent = over ? "Tracking units can't go over the order. Only " + fmt(ctx.left) + " units are left to track." : fmt(ctx.left - u) + " units will still have no tracking. You can add more later."; };
      $("t-num").addEventListener("input", upd); $("t-units").addEventListener("input", upd); upd();
    }
    if (kind === "new") {
      var sum = function () { var p = SR.product($("n-prod").value), u = +$("n-units").value || 0, ordered = p.st[0] + p.st[1] + p.st[2]; $("n-sum").textContent = p.burn ? "Lands about " + dayStr(45) + ", " + ((p.stock + ordered + u) / p.burn).toFixed(1) + " days incl. ordered." : "Lands about " + dayStr(45) + "."; };
      $("n-units").addEventListener("input", sum);
      $("n-plans").addEventListener("change", function (e) { if (e.target.name === "plan") { $("n-units").value = e.target.value; sum(); } });
      sum();
    }
    if (kind === "arrival") {
      var prev = function () {
        var code = $("a-prod").value, u = +$("a-units").value || 0, open = SR.openOrdersFor(code), r = SR.fifo(u, open), html = "";
        if (!open.length) html = '<div class="callout crit">' + icon("circle-alert") + '<span>There are no open orders for this product, so all ' + fmt(u) + ' units will be unmatched. You can still record the arrival.</span></div>';
        else html = '<div class="stack" style="gap:4px">' + r.allocs.map(function (al) { return '<div class="mrow"><b style="font-weight:600">' + al.name + '</b><span class="track"><i style="width:' + Math.round(al.take / al.rem * 100) + '%"></i></span><span>' + fmt(al.take) + ' of ' + fmt(al.rem) + '</span></div>'; }).join("") + '</div>' + (r.left > 0 ? '<div class="callout crit" style="margin-top:8px">' + icon("circle-alert") + '<span>' + fmt(r.left) + ' units match no order. They will show on the unmatched list.</span></div>' : '<div class="callout good" style="margin-top:8px">' + icon("circle-check") + '<span>Every unit has an order.</span></div>');
        $("a-prev").innerHTML = html; $("a-sum").textContent = "Stock goes up by " + fmt(u) + ".";
      };
      $("a-units").addEventListener("input", prev); $("a-prod").addEventListener("change", prev); prev();
    }
    if (kind === "fix") {
      var chk = function () { var inputs = document.querySelectorAll("#modals input[data-fix]"), tot = 0; inputs.forEach(function (i) { tot += +i.value || 0; });
        var st = $("f-state"), ok = tot === ctx.units; st.className = "callout " + (ok ? "good" : "crit");
        st.querySelector("span").textContent = ok ? "All " + fmt(ctx.units) + " units are assigned." : "Assigned " + fmt(tot) + " of " + fmt(ctx.units) + ". The total must match the arrival.";
        $("f-save").disabled = !ok; };
      document.querySelectorAll("#modals input[data-fix]").forEach(function (i) { i.addEventListener("input", chk); }); chk();
    }
  }

  /* ---------- render and events ---------- */
  var PAGES = [["orders", "Orders"], ["order", "Order detail"], ["arrivals", "Arrivals"], ["stock", "Stock"], ["chase", "Chase list", 1], ["history", "Product history", 1], ["settings", "Settings", 1], ["login", "Login", 1], ["supplier", "Supplier view", 1], ["errors", "Error pages", 1]];
  function render() {
    var el = document.getElementById("app");
    el.innerHTML = S.page === "orders" ? pageOrders() : S.page === "order" ? pageOrder() : S.page === "arrivals" ? pageArrivals() : S.page === "stock" ? pageStock() : pageNext(S.page);
    document.getElementById("brief").innerHTML = brief();
    document.getElementById("picker").innerHTML = PAGES.map(function (p) { return '<button class="pk" role="tab" type="button" data-page="' + p[0] + '" aria-selected="' + (S.page === p[0]) + '">' + p[1] + (p[2] ? ' <span class="next">next</span>' : "") + '</button>'; }).join("");
  }
  SR.render = { orders: pageOrders, order: pageOrder, arrivals: pageArrivals, stock: pageStock, brief: brief, msgText: msgText, planCards: planCards, matchBar: matchBar, stagebar: stagebar };
  SR.state = S;

  function closePops() { document.querySelectorAll(".pop").forEach(function (p) { p.hidden = true; }); document.querySelectorAll("[data-pop]").forEach(function (b) { b.setAttribute("aria-expanded", "false"); }); }
  function go(page) { S.page = page; S.flags = {}; closePops(); render(); }
  function onClick(e) {
    var t = e.target;
    var pk = t.closest("[data-page]"); if (pk) { go(pk.dataset.page); return; }
    var g = t.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
    var pp = t.closest("[data-pop]");
    if (pp) { var bar = pp.closest(".topbar, .rel"), pop = bar.querySelector('.pop[data-for="' + pp.dataset.pop + '"]'), was = !pop.hidden; closePops(); if (!was) { pop.hidden = false; pp.setAttribute("aria-expanded", "true"); } return; }
    var a = t.closest("[data-act]");
    if (!a) { if (!t.closest(".pop")) closePops(); return; }
    var act = a.dataset.act;
    if (act === "scrim") { if (t === a) closeModal(); return; }
    if (act === "close") { closeModal(); return; }
    if (act === "open-order") { S.orderName = a.dataset.id; S.flags = {}; S.page = "order"; render(); return; }
    if (act === "pick-order") { S.orderName = a.dataset.id; S.flags = {}; render(); return; }
    if (act === "flag") { var f = a.dataset.f, was2 = !!S.flags[f]; S.flags = {}; if (!was2) S.flags[f] = true; render(); return; }
    if (act === "filter") { S.filter = a.dataset.f; render(); return; }
    if (act === "example") { return; }
    if (act === "new-order") { openModal("new", { code: a.dataset.code }); return; }
    if (act === "modal") { closePops(); openModal(a.dataset.m, { k: a.dataset.k, id: a.dataset.id }); return; }
    if (act === "copy") { var txt = document.getElementById("msgtext").textContent; var done = function () { document.getElementById("msgstate").textContent = "Copied. Paste it into your email."; }; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { document.getElementById("msgstate").textContent = "Select the text and press Ctrl+C."; }); else document.getElementById("msgstate").textContent = "Select the text and press Ctrl+C."; return; }
  }
  function onChange(e) {
    var t = e.target;
    if (t.id === "ex-toggle") { S.showExample = t.checked; render(); return; }
    if (t.dataset && t.dataset.act === "new-prod") { document.getElementById("n-plans").innerHTML = planCards(t.value); var p = SR.product(t.value); document.getElementById("n-units").value = p.sugg || ""; document.getElementById("n-units").dispatchEvent(new Event("input")); }
  }
  function onKey(e) {
    if (e.key === "Escape") { if (S.modal) closeModal(); closePops(); }
    if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.act === "open-order") { e.preventDefault(); e.target.click(); }
  }
  if (document.getElementById("app").addEventListener) {
    document.addEventListener("click", onClick); document.addEventListener("change", onChange); document.addEventListener("keydown", onKey);
    var shell = document.getElementById("shell");
    var devsw = document.getElementById("devsw"), thsw = document.getElementById("thsw");
    devsw.addEventListener("click", function (e) { var b = e.target.closest("button[data-d]"); if (!b) return; S.device = b.dataset.d; shell.classList.toggle("phone", S.device === "phone"); devsw.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); });
    thsw.addEventListener("click", function (e) { var b = e.target.closest("button[data-t]"); if (!b) return; shell.classList.remove("force-light", "force-dark"); if (b.dataset.t !== "page") shell.classList.add("force-" + b.dataset.t); thsw.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); });
    render();
  }
})();
</script>
