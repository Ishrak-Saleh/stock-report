<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181818">
  <title>{% block title %}Stock Report{% endblock %}</title>
  <script src="/static/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/"><span class="logo">{{ icon("package") }}</span>Stock Report</a>
      <nav class="tabs" aria-label="Primary">
        <a class="tab" href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Stock</a>
        <a class="tab" href="/orders" {% if request.url.path.startswith("/orders") %}aria-current="page"{% endif %}>Orders</a>
      </nav>
      <div class="right">
        <span class="meta">Today, {{ store_today()|short_date }}</span>
        <button class="iconbtn" type="button" id="theme-toggle" aria-label="Switch between dark and light">
          <span class="theme-sun">{{ icon("sun") }}</span><span class="theme-moon">{{ icon("moon") }}</span>
        </button>
      </div>
    </header>
    <main id="main">{% block content %}{% endblock %}</main>
  </div>
  <div id="modal-host"></div>
</body>
</html>
